<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Site theme follows the system (Fluid tokens switch on .dark).
      ;(function () {
        var m = window.matchMedia('(prefers-color-scheme: dark)')
        // The editor pins the theme to its preview background (data-theme-lock).
        var apply = function () {
          if (document.documentElement.hasAttribute('data-theme-lock')) return
          document.documentElement.classList.toggle('dark', m.matches)
        }
        apply()
        m.addEventListener('change', apply)
      })()
    </script>
    <title>Stampit — Make your own badge</title>
    <meta name="description" content="A tiny, customizable badge for your footer. Style it, add your links, paste one snippet. No account, no dependency." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <!-- TODO(PRD §16): replace https://stampit.dev once the domain is settled. -->
    <link rel="canonical" href="https://stampit.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stampit" />
    <meta property="og:title" content="Stampit — Make your own badge" />
    <meta property="og:description" content="Stamp everything you ship. A tiny, customizable badge for your footer: style it, add your links, paste one snippet." />
    <meta property="og:url" content="https://stampit.dev/" />
    <meta property="og:image" content="https://stampit.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A “Made by Olivier Tousche” badge with a round avatar and an arrow." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stampit — Make your own badge" />
    <meta name="twitter:description" content="Stamp everything you ship. A tiny, customizable badge for your footer." />
    <meta name="twitter:image" content="https://stampit.dev/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
